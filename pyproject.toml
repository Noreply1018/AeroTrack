[project]
name = "aerotrack"
version = "0.1.0"
description = "Reproducible radar detection and tracking experiment baseline."
readme = "docs/spec/README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "motmetrics>=1.4.0",
  "numpy>=1.26,<2.0",
  "pillow>=10.0",
  "pyyaml>=6.0.2",
  "scipy>=1.11",
]

[project.optional-dependencies]
vision = [
  "numpy>=1.26,<2.0",
  "pillow>=10.0",
]
tracking = [
  "motmetrics>=1.4.0",
  "scipy>=1.11",
]
yolo = [
  "ultralytics>=8.3",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
aerotrack = "aerotrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerotrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
