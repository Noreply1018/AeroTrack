name: carrada
representation: range_angle
root: data/carrada
prepared_root: data/processed/carrada_ra_smoke
splits:
  strategy: official
  seed: 42
  max_sequences: 2
  prefer_train_and_test: true
normalization:
  method: minmax
  output_dtype: uint8
  channels: 3
annotations:
  preferred_source: range_angle.box
  fallback_source: range_angle.dense_bbox
  empty_frames: keep
raw_label_mapping:
  "1": 0
  "2": 1
  "3": 2
classes:
  - id: 0
    name: pedestrian
  - id: 1
    name: cyclist
  - id: 2
    name: car
